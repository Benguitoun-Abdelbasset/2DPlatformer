<div class="min-h-screen flex flex-col bg-gradient-to-br from-indigo-600 to-purple-700 text-white p-4">
  <h2 class="text-2xl font-bold mb-4">Choose a Level</h2>

  <div *ngIf="isLoading" class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-70 z-50">
    <div class="w-16 h-16 border-4 border-white border-t-transparent rounded-full animate-spin"></div>
  </div>

    <!-- Game shows here -->
    <div class="mb-6">
      <app-game *ngIf="!isLoading && inputlevel" [inputlevel]="inputlevel"
        (levelFinished)="onChildFinished($event)"></app-game>
    </div>


  <div *ngIf="!isLoading && !inputlevel"
    class="min-h-screen flex flex-col bg-gradient-to-br from-indigo-600 to-purple-700 text-white p-4">

    <!-- Difficulty slider + buttons -->
    <div class="flex flex-col md:flex-row items-center gap-3 mb-4">
      <label class="text-white font-medium">Difficulty: {{ selectedDifficulty }}</label>
      <input type="range" min="1" max="5" [value]="selectedDifficulty" (input)="onSliderChange($event)"
        class="w-full md:w-64 accent-white" />
      <button (click)="generateLevel()"
        class="px-4 py-2 bg-white text-indigo-700 rounded-full font-semibold hover:bg-indigo-100 transition">
        Generate Level
      </button>
      <button (click)="loadNextLevel()"
        class="px-4 py-2 bg-white text-indigo-700 rounded-full font-semibold hover:bg-indigo-100 transition"
        [disabled]="!currentLevelIndex && currentLevelIndex === userLevels.length - 1">
        Next Level
      </button>
    </div>



    <!-- Level Cards Grid -->
    <div class="grid grid-cols-2 md:grid-cols-4 xl:grid-cols-5 gap-3 overflow-y-auto max-h-[80vh] pr-1">
      <div *ngFor="let userLevel of userLevels"
        class="aspect-[4/5] bg-white bg-opacity-10 rounded-xl shadow-md p-3 backdrop-blur-sm flex flex-col justify-between hover:scale-[1.01] transition-transform">
        <div>
          <h3 class="text-base font-semibold text-black">Level {{ userLevel.displayId }}</h3>
          <p class="text-xs text-black">Difficulty: {{ userLevel.leveldata.difficulty }}</p>
          <p class="text-xs text-black">best Score: {{ userLevel.bestScore }}</p>
          <p class="text-xs text-black">Attempts: {{ userLevel.attempts }}</p>
        </div>

        <button (click)="loadLevel(userLevel)"
          class="mt-3 px-2 py-1 bg-white text-indigo-700 text-sm rounded-full font-semibold hover:bg-indigo-100 transition">
          Play
        </button>
      </div>
    </div>
  </div>
</div>
